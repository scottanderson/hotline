[workspace]
resolver = "2"
members = [
    "crates/hotline-proto",
    "crates/hotline-codec",
    "crates/hotline-client",
    "crates/hotline-server",
    "crates/hotline-tracker",
    "crates/hotline-cli",
    "crates/hotline-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scottanderson/hotline"
rust-version = "1.96"
keywords = ["hotline", "trtp", "chat", "bbs", "protocol"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
expect_used = "warn"
indexing_slicing = "warn"
missing_const_for_fn = "warn"
missing_panics_doc = "warn"
panic = "warn"
string_slice = "warn"
unreachable = "warn"
unwrap_used = "warn"

[workspace.dependencies]
hotline-proto = { path = "crates/hotline-proto", version = "0.1.0" }
hotline-codec = { path = "crates/hotline-codec", version = "0.1.0" }
hotline-client = { path = "crates/hotline-client", version = "0.1.0" }
hotline-server = { path = "crates/hotline-server", version = "0.1.0" }
hotline-tracker = { path = "crates/hotline-tracker", version = "0.1.0" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1"
thiserror = "1"
async-trait = "0.1"
anyhow = "1"
bitflags = "2"
num_enum = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "~4.4", features = ["derive", "env"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
humantime = "2"
arc-swap = "1"
encoding_rs = "0.8"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
getrandom = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rustix = { version = "1", features = ["fs"] }
unicode-general-category = "1"
unicode-segmentation = "1"
sys-locale = "0.3"

[profile.release]
lto = true
codegen-units = 1
