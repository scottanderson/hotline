[package]
name = "hotline-cli"
description = "hlc, a terminal Hotline client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "network-programming"]

[package.metadata.cargo-machete]
# crossterm turns on the event-stream feature of ratatui's crossterm.
ignored = ["crossterm"]

[[bin]]
name = "hlc"
path = "src/main.rs"

[dependencies]
hotline-client = { workspace = true }
hotline-proto = { workspace = true, features = ["chrono"] }
hotline-tracker = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
bitflags = { workspace = true }
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
crossterm = { workspace = true }
sys-locale = { workspace = true }
chrono = { workspace = true, features = ["unstable-locales"] }
unicode-segmentation = { workspace = true }

[dev-dependencies]
hotline-server = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
